[build]
  command = "npm run build"
  publish = "dist"

# Analytics - visitor tracking (privacy-focused)
[[headers]]
  for = "/*"
  [headers.values]
    X-Analytics = "true"

# Audio files - serve directly, no redirect
[[redirects]]
  from = "/audio/*"
  to = "/audio/:splat"
  status = 200

[[redirects]]
  from = "/blog.html"
  to = "/signal/"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/signal/"
  status = 301

[[redirects]]
  from = "/blog"
  to = "/signal/"
  status = 301

[[redirects]]
  from = "/"
  to = "/signal/"
  status = 301

# Phase 6: Cache-Control headers for optimal performance

# Audio files - long-term cache (1 year)
[[headers]]
  for = "/audio/*.mp3"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Content-Type = "audio/mpeg"
    Accept-Ranges = "bytes"

# Static assets - long-term cache (1 year)
[[headers]]
  for = "/*_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Images - long-term cache (1 year)
[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.avif"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"

# Fonts - long-term cache
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# HTML - short cache for ISR
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, stale-while-revalidate=86400"
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Security headers for all pages
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"